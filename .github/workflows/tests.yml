name: Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "cryptography>=42,<47"
      - name: Restore pinned Vidyut data
        uses: actions/cache@v4
        with:
          path: data/external/vidyut-0.4.0
          key: vidyut-data-0.4.0-${{ hashFiles('scripts/fetch_vidyut_data.py') }}
      - name: Fetch pinned Vidyut data (checksum verified, never committed)
        run: python scripts/fetch_vidyut_data.py
      - name: Validate draft rule structure
        run: python scripts/validate_rules.py
      - name: Type-check
        run: python -m mypy
      - name: Run tests
        run: python -m pytest tests -q
  cpu-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training dependencies
        run: |
          python -m pip install -r requirements.txt "numpy>=1.26,<3"
          python -m pip install "torch>=2.1,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Type-check with numpy and torch installed
        run: python -m mypy
      - name: Restore pinned Vidyut data
        uses: actions/cache@v4
        with:
          path: data/external/vidyut-0.4.0
          key: vidyut-data-0.4.0-${{ hashFiles('scripts/fetch_vidyut_data.py') }}
      - name: Fetch pinned Vidyut data (checksum verified, never committed)
        run: python scripts/fetch_vidyut_data.py
      - name: Test complete pipeline including checkpoint round trip
        run: python -m pytest tests -q
